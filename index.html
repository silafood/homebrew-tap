<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>silafood Homebrew Tap</title>
  <style>
    :root { --bg: #0d1117; --fg: #e6edf3; --accent: #58a6ff; --muted: #8b949e; --card: #161b22; --border: #30363d; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 4rem 1.5rem; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: var(--muted); margin-bottom: 3rem; font-size: 1.1rem; }
    .install-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem 2rem; margin-bottom: 2rem; max-width: 600px; width: 100%; }
    .install-box h2 { font-size: 1rem; color: var(--muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.6rem 1rem; display: block; font-size: 0.95rem; color: var(--accent); overflow-x: auto; }
    .formulae { background: var(--card); border: 1px solid var(--border); border-radius: 8px; max-width: 600px; width: 100%; overflow: hidden; margin-bottom: 2rem; }
    .formulae h2 { font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 1rem 1.5rem 0.5rem; }
    .formula { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .formula-name { font-weight: 600; }
    .formula-name a { color: var(--accent); text-decoration: none; }
    .formula-name a:hover { text-decoration: underline; }
    .formula-desc { color: var(--muted); font-size: 0.9rem; }
    footer { margin-top: auto; padding-top: 3rem; color: var(--muted); font-size: 0.85rem; }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <h1>silafood/tap</h1>
  <p class="subtitle">Homebrew formulae for silafood tools</p>

  <div class="install-box">
    <h2>Add this tap</h2>
    <code>brew tap silafood/tap https://github.com/silafood/homebrew-tap</code>
  </div>

  <div class="formulae">
    <h2>Available Formulae</h2>
    <div class="formula">
      <div>
        <div class="formula-name"><a href="https://github.com/silafood/runsteps">runsteps</a></div>
        <div class="formula-desc">Interactive config-driven task runner</div>
      </div>
      <code style="display: inline; padding: 0.3rem 0.6rem;">brew install silafood/tap/runsteps</code>
    </div>
  </div>

  <footer>
    <a href="https://github.com/silafood">github.com/silafood</a>
  </footer>
</body>
</html>
